name: Frontend CI

on: 
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs: 
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with: 
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci 

      - name: Run Linter
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit 

      - name: Build project
        run: npm run build